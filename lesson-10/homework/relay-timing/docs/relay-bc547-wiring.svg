<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
  <defs>
    <style>
      .title{font:700 28px sans-serif;fill:#172033}.label{font:600 17px sans-serif;fill:#172033}.small{font:14px sans-serif;fill:#334155}
      .part{fill:#f8fafc;stroke:#334155;stroke-width:3;rx:12}.wire{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .power{fill:none;stroke:#dc2626;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .feedback{fill:none;stroke:#16a34a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:10}.node{fill:#2563eb}
    </style>
  </defs>
  <rect width="1300" height="720" fill="#fff"/>
  <text x="45" y="45" class="title">Домашня робота: вимірювання реле через BC547B</text>

  <rect x="45" y="90" width="250" height="470" class="part" fill="#eff6ff"/>
  <text x="170" y="130" text-anchor="middle" class="label">ESP32-S3</text>
  <text x="280" y="220" text-anchor="end" class="small">GPIO16 OUT</text>
  <text x="280" y="420" text-anchor="end" class="small">GPIO18 INPUT_PULLUP</text>
  <text x="280" y="510" text-anchor="end" class="small">GND</text>

  <path d="M295 215 H365" class="wire"/>
  <rect x="365" y="195" width="110" height="40" class="part"/>
  <text x="420" y="221" text-anchor="middle" class="label">10 кОм</text>
  <path d="M475 215 H540" class="wire"/>

  <rect x="540" y="165" width="160" height="170" class="part" fill="#f1f5f9"/>
  <text x="620" y="202" text-anchor="middle" class="label">BC547B</text>
  <text x="555" y="225" class="small">B</text>
  <text x="620" y="180" text-anchor="middle" class="small">C</text>
  <text x="620" y="325" text-anchor="middle" class="small">E</text>
  <path d="M620 335 V510 H295" class="ground"/>

  <rect x="790" y="105" width="440" height="440" class="part" fill="#fefce8"/>
  <text x="1010" y="145" text-anchor="middle" class="label">Relay module 5 V</text>
  <text x="815" y="205" class="small">VCC</text>
  <text x="815" y="260" class="small">IN</text>
  <text x="815" y="315" class="small">GND</text>
  <text x="1205" y="215" text-anchor="end" class="small">NC</text>
  <text x="1205" y="300" text-anchor="end" class="small">NO</text>
  <text x="1205" y="385" text-anchor="end" class="small">COM</text>

  <path d="M620 165 V255 H790" class="wire"/>
  <circle cx="745" cy="255" r="6" class="node"/>
  <rect x="725" y="155" width="40" height="75" class="part"/>
  <text x="775" y="195" class="small">10 кОм</text>
  <path d="M745 230 V255" class="power"/>
  <path d="M745 155 V105 H845 V200 H790" class="power"/>
  <text x="720" y="95" class="label">+5V</text>

  <path d="M790 310 H750 V510 H620" class="ground"/>
  <path d="M295 415 H1090 V295 H1230" class="feedback"/>
  <text x="530" y="405" class="small">сухий контакт NO</text>
  <path d="M1230 380 H1150 V510 H750" class="ground"/>
  <path d="M1230 210 H1260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="1130" y="200" class="small">NC не підключати</text>

  <path d="M295 510 H1150" class="ground"/>
  <path d="M620 510 V530 M600 530 H640 M607 542 H633 M614 554 H626" class="ground"/>

  <rect x="45" y="605" width="1185" height="80" class="note"/>
  <text x="65" y="636" class="label">Важливо</text>
  <text x="65" y="663" class="small">GPIO16 HIGH → BC547B відкритий → IN притиснутий до GND → active-LOW relay module увімкнений. COM і NO не підключати до +5V.</text>
</svg>
