<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 700 30px sans-serif; fill: #172033; }
      .section { font: 700 23px sans-serif; fill: #172033; }
      .label { font: 600 17px sans-serif; fill: #172033; }
      .small { font: 15px sans-serif; fill: #334155; }
      .tiny { font: 13px sans-serif; fill: #475569; }
      .part { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 12; }
      .required { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 14; }
      .optional { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; rx: 14; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
      .signal { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .feedback { fill: none; stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .optionalWire { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 9 7; }
      .node { fill: #2563eb; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="55" y="48" class="title">Модуль 2.2 — схема домашньої роботи</text>

  <!-- ESP32 -->
  <rect x="55" y="95" width="270" height="690" class="part" fill="#f1f5f9"/>
  <text x="190" y="138" text-anchor="middle" class="section">ESP32-S3</text>
  <text x="305" y="205" text-anchor="end" class="label">GPIO 16</text>
  <text x="305" y="285" text-anchor="end" class="label">GPIO 18</text>
  <text x="305" y="395" text-anchor="end" class="label">GPIO 2</text>
  <text x="305" y="505" text-anchor="end" class="label">GPIO 17</text>
  <text x="305" y="585" text-anchor="end" class="label">GPIO 4 / TX</text>
  <text x="305" y="285" text-anchor="end" class="label">GPIO 18</text>
  <text x="305" y="390" text-anchor="end" class="label">GPIO 2 / ADC</text>
  <text x="305" y="505" text-anchor="end" class="label">GPIO 17 / PWM</text>
  <text x="305" y="585" text-anchor="end" class="label">GPIO 4 / UART TX</text>
  <text x="305" y="675" text-anchor="end" class="label">3.3V</text>
  <text x="305" y="720" text-anchor="end" class="label">5V</text>
  <text x="305" y="765" text-anchor="end" class="label">GND</text>

  <!-- Task 1 container -->
  <rect x="370" y="85" width="1070" height="290" class="required"/>
  <text x="400" y="122" class="section">Завдання 1 — реле (обов’язково)</text>

  <!-- Relay module -->
  <rect x="690" y="145" width="260" height="190" class="part" fill="#fefce8"/>
  <text x="820" y="180" text-anchor="middle" class="label">Relay module 5 V</text>
  <text x="710" y="218" class="small">IN</text>
  <text x="710" y="258" class="small">VCC</text>
  <text x="710" y="298" class="small">GND</text>
  <text x="925" y="218" text-anchor="end" class="small">NO</text>
  <text x="925" y="258" text-anchor="end" class="small">COM</text>
  <text x="925" y="298" text-anchor="end" class="small">NC</text>

  <!-- Relay input wires -->
  <path d="M325 200 H690" class="signal"/>
  <text x="470" y="190" class="small">керування реле</text>
  <path d="M325 720 H520 V255 H690" class="power"/>
  <path d="M325 760 H560 V295 H690" class="ground"/>

  <!-- Dry contact feedback -->
  <path d="M950 215 H1100 V280 H325" class="feedback"/>
  <text x="1065" y="205" class="small">NO → GPIO18</text>
  <path d="M950 255 H1040 V345 H560" class="ground"/>
  <text x="1055" y="330" class="small">COM → GND</text>
  <line x1="950" y1="295" x2="1020" y2="295" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="1030" y="300" class="tiny">NC не підключати</text>

  <rect x="1140" y="150" width="265" height="175" class="note"/>
  <text x="1160" y="180" class="label">INPUT_PULLUP</text>
  <text x="1160" y="211" class="small">Реле OFF: GPIO18 = HIGH</text>
  <text x="1160" y="240" class="small">Реле ON: GPIO18 = LOW</text>
  <text x="1160" y="275" class="small">Код очікує активний HIGH</text>
  <text x="1160" y="302" class="tiny">Для active-LOW інвертуй керування.</text>

  <!-- Task 2 container -->
  <rect x="370" y="405" width="1070" height="380" class="optional"/>
  <text x="400" y="442" class="section">Завдання 2 — потенціометр і software PWM (опційно)</text>

  <!-- Potentiometer -->
  <rect x="430" y="485" width="230" height="180" class="part" fill="#fefce8"/>
  <text x="545" y="520" text-anchor="middle" class="label">Потенціометр 10 кОм</text>
  <text x="450" y="560" class="small">VCC</text>
  <text x="450" y="600" class="small">SIG</text>
  <text x="450" y="640" class="small">GND</text>
  <path d="M325 675 H390 V555 H430" class="power"/>
  <path d="M325 390 H385 V595 H430" class="feedback"/>
  <path d="M325 760 H405 V635 H430" class="ground"/>

  <!-- Base resistor and transistor -->
  <path d="M325 500 H720" class="signal"/>
  <rect x="720" y="480" width="120" height="40" class="part"/>
  <text x="780" y="507" text-anchor="middle" class="label">1 кОм</text>
  <path d="M840 500 H910" class="signal"/>
  <circle cx="875" cy="500" r="6" class="node"/>

  <rect x="910" y="465" width="175" height="170" class="part" fill="#f1f5f9"/>
  <text x="997" y="500" text-anchor="middle" class="label">2N2222</text>
  <text x="925" y="525" class="small">B</text>
  <text x="997" y="480" text-anchor="middle" class="small">C</text>
  <text x="997" y="625" text-anchor="middle" class="small">E</text>

  <!-- Base pull-down -->
  <path d="M875 500 V550" class="signal"/>
  <rect x="855" y="550" width="40" height="100" class="part"/>
  <text x="905" y="605" class="small">10 кОм</text>
  <path d="M875 650 V760 H325" class="ground"/>

  <!-- Motor -->
  <circle cx="1180" cy="525" r="65" class="part" fill="#fefce8"/>
  <text x="1180" y="535" text-anchor="middle" class="title">M</text>
  <text x="1180" y="610" text-anchor="middle" class="label">DC-мотор 5 V</text>
  <path d="M997 465 V445 H1100 V590 H1180" class="signal"/>
  <path d="M1180 460 V430 H1320" class="power"/>
  <text x="1275" y="420" class="small">зовнішні +5V</text>
  <path d="M997 635 V760 H325" class="ground"/>

  <!-- Flyback diode -->
  <rect x="1260" y="490" width="120" height="85" class="part" fill="#fef2f2"/>
  <text x="1320" y="520" text-anchor="middle" class="label">1N4007</text>
  <text x="1320" y="546" text-anchor="middle" class="small">K смуга ↑</text>
  <text x="1320" y="567" text-anchor="middle" class="tiny">A до колектора</text>
  <path d="M1320 490 V430" class="power"/>
  <path d="M1320 575 V590 H1180" class="signal"/>
  <path d="M1320 575 V650 H1180" class="signal"/>

  <!-- Capacitor -->
  <path d="M1115 525 H1095 M1095 505 V545 M1080 505 V545 M1080 525 H1065" class="optionalWire"/>
  <text x="1070" y="690" class="small">100 нФ паралельно мотору</text>

  <!-- UART experiment -->
  <path d="M325 580 H675" class="optionalWire"/>
  <rect x="675" y="555" width="185" height="55" class="part" fill="#faf5ff"/>
  <text x="767" y="589" text-anchor="middle" class="small">Logic Analyzer D1</text>
  <text x="400" y="570" class="tiny">UART: 0x00, 0x0F, 0x55, 0xFF</text>

  <!-- Shared ground -->
  <path d="M325 760 H1380" class="ground"/>
  <path d="M325 760 V780 M305 780 H345 M312 792 H338 M319 804 H331" class="ground"/>
  <text x="600" y="750" class="small">спільний GND: ESP32 + relay module + живлення мотора</text>

  <!-- Bottom notes -->
  <rect x="55" y="840" width="1385" height="105" class="note"/>
  <text x="80" y="873" class="label">Важливо</text>
  <text x="80" y="903" class="small">• Завдання 1 і 2 незалежні: для обов’язкової частини достатньо підключити лише relay module.</text>
  <text x="80" y="930" class="small">• Мотор не живити від GPIO/3.3V. Перевір pinout E/B/C транзистора. Смуга 1N4007 завжди до +5V.</text>
</svg>
