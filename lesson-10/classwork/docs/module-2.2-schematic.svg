<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 26px sans-serif; fill: #172033; }
      .label { font: 600 17px sans-serif; fill: #172033; }
      .small { font: 14px sans-serif; fill: #334155; }
      .wire { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .part { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 10; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 8; }
      .node { fill: #2563eb; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="50" y="45" class="title">Модуль 2.2 — керування DC-мотором через 2N2222</text>

  <!-- ESP32 -->
  <rect x="55" y="90" width="230" height="500" class="part" fill="#eff6ff"/>
  <text x="170" y="130" text-anchor="middle" class="label">ESP32-S3</text>
  <text x="270" y="205" text-anchor="end" class="small">GPIO 17</text>
  <text x="270" y="420" text-anchor="end" class="small">GPIO 2 / ADC</text>
  <text x="270" y="350" text-anchor="end" class="small">3.3V</text>
  <text x="270" y="555" text-anchor="end" class="small">GND</text>

  <!-- GPIO17 to base resistor -->
  <path d="M285 200 H360" class="wire"/>
  <rect x="360" y="180" width="115" height="40" class="part"/>
  <text x="417" y="206" text-anchor="middle" class="label">1 кОм</text>
  <path d="M475 200 H545" class="wire"/>
  <circle cx="510" cy="200" r="6" class="node"/>
  <path d="M510 200 V260" class="wire"/>
  <rect x="490" y="260" width="40" height="90" class="part"/>
  <text x="540" y="312" class="small">10 кОм</text>
  <path d="M510 350 V555 H620" class="ground"/>

  <!-- Transistor block -->
  <rect x="545" y="145" width="150" height="150" class="part" fill="#f1f5f9"/>
  <text x="620" y="185" text-anchor="middle" class="label">2N2222</text>
  <text x="557" y="207" class="small">B</text>
  <text x="620" y="232" text-anchor="middle" class="small">NPN</text>
  <text x="620" y="163" text-anchor="middle" class="small">C</text>
  <text x="620" y="288" text-anchor="middle" class="small">E</text>

  <!-- Emitter to ground -->
  <path d="M620 295 V555 H285" class="ground"/>
  <path d="M620 555 V575 M600 575 H640 M607 587 H633 M614 599 H626" class="ground"/>

  <!-- Collector and DC motor -->
  <path d="M620 145 V250 H745" class="wire"/>
  <circle cx="745" cy="160" r="60" class="part" fill="#fefce8"/>
  <text x="745" y="170" text-anchor="middle" class="title">M</text>
  <text x="745" y="240" text-anchor="middle" class="label">DC-мотор 5 V</text>
  <path d="M745 220 V250" class="wire"/>

  <!-- +5V rail -->
  <path d="M745 100 V65 H1010" class="power"/>
  <text x="835" y="55" text-anchor="middle" class="label" fill="#dc2626">+5V</text>

  <!-- Flyback diode -->
  <path d="M860 65 V105" class="power"/>
  <rect x="820" y="105" width="80" height="90" class="part" fill="#fef2f2"/>
  <text x="860" y="135" text-anchor="middle" class="label">1N4007</text>
  <text x="860" y="159" text-anchor="middle" class="small">K — смуга</text>
  <text x="860" y="183" text-anchor="middle" class="small">A</text>
  <path d="M860 195 V250 H745" class="wire"/>
  <circle cx="745" cy="250" r="6" class="node"/>

  <!-- External motor supply -->
  <rect x="950" y="115" width="190" height="185" class="part" fill="#f0fdf4"/>
  <text x="1045" y="150" text-anchor="middle" class="label">зовнішнє живлення</text>
  <text x="1045" y="190" text-anchor="middle" class="title">5 V</text>
  <text x="1045" y="225" text-anchor="middle" class="small">струм із запасом</text>
  <text x="1045" y="255" text-anchor="middle" class="small">не живити мотор від ESP32</text>

  <!-- LDR divider -->
  <text x="355" y="335" class="label">Дільник LDR</text>
  <path d="M285 345 H385" class="power"/>
  <rect x="385" y="325" width="100" height="40" class="part"/>
  <text x="435" y="351" text-anchor="middle" class="label">LDR</text>
  <path d="M485 345 H525 V415 H285" class="wire"/>
  <circle cx="525" cy="345" r="6" class="node"/>
  <path d="M525 345 H580" class="wire"/>
  <rect x="580" y="325" width="100" height="40" class="part"/>
  <text x="630" y="351" text-anchor="middle" class="label">10 кОм</text>
  <path d="M680 345 H720 V555 H620" class="ground"/>

  <!-- External supply ground -->
  <path d="M1010 65 V85" class="power"/>
  <text x="1010" y="105" text-anchor="middle" class="small">плюс мотора</text>
  <path d="M1010 315 V555 H720" class="ground"/>
  <text x="980" y="545" text-anchor="end" class="small">спільний GND</text>

  <!-- Notes -->
  <rect x="55" y="635" width="1090" height="90" class="note"/>
  <text x="75" y="665" class="label">Важливо</text>
  <text x="75" y="692" class="small">• Смуга 1N4007 (катод K) підключається до +5V; анод A — до колектора.</text>
  <text x="630" y="692" class="small">• Перевір pinout E/B/C конкретного 2N2222.</text>
  <text x="75" y="715" class="small">• ESP32 GND і GND джерела 5V мають бути спільними. Для макетки використовуй лише низьку напругу.</text>
</svg>
