[env:stm32f411]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
monitor_speed = 115200
monitor_filters = log2file
upload_protocol = stlink
debug_tool = stlink
build_type = debug
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include/Stm32
    -I include/Stm32/Usb
    -D USBCON
    -D USBD_USE_CDC
