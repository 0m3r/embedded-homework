; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
monitor_speed = 115200
build_type = debug
debug_init_break = tbreak main

; --- ОБЕРИ ОДИН спосіб прошивки (розкоментуй потрібний) ---
upload_protocol = stlink ; ① ST-Link V2 (SWD) — рекомендовано
; upload_protocol = dfu  ; ② USB-DFU (через BOOT0, без програматора)
; upload_protocol = serial ; ③ UART через USB-TTL (PA9/PA10)
debug_tool = stlink

; --- Serial Monitor прямо через USB-C плати (щоб не потрібен був USB-TTL) ---
build_flags =
  -std=gnu++17
  -D USBCON
  -D USBD_USE_CDC
build_unflags = -std=gnu++11
