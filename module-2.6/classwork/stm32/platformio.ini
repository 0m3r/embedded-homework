[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_type = debug
debug_init_break = tbreak main
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include/Stm32/Usb
    -D USBCON
    -D USBD_USE_CDC
