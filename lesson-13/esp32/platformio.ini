[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32s3_debug]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D FAN_DEBUG_TIMING
