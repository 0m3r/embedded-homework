[platformio]
default_envs = esp32s3, stm32f411

[env]
build_unflags = -std=gnu++11
monitor_speed = 115200

[env:esp32s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
build_flags = -std=gnu++17
build_src_filter =
  -<*>
  +<Debouncer/>
  +<Esp32/>

[env:stm32f411]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_type = debug
debug_init_break = tbreak main
build_flags =
  -std=gnu++17
  -I include/Stm32/Usb
  -D USBCON
  -D USBD_USE_CDC
build_src_filter =
  -<*>
  +<Debouncer/>
  +<Stm32/>
